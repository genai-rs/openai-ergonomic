[package]
name = "openai-ergonomic"
version = "0.23.0"
authors = ["Tim Van Wassenhove <github@timvw.be>"]
edition = "2021"
rust-version = "1.88"
description = "Ergonomic Rust wrapper for OpenAI API"
documentation = "https://docs.rs/openai-ergonomic"
readme = "README.md"
homepage = "https://github.com/genai-rs/openai-ergonomic"
repository = "https://github.com/genai-rs/openai-ergonomic"
license = "MIT OR Apache-2.0"
keywords = ["openai", "api", "ai", "gpt", "assistant"]
categories = ["api-bindings", "asynchronous"]
exclude = [".github", "docs/", ".gitignore"]

[dependencies]
openai-client-base = { version = "^0.34.0", default-features = false, features = [
    # Every model (`types`), and the API groups whose operations the client calls.
    "types",
    "administration", # usage
    "assistants",
    "audio",
    "batch",
    "chat-completion",
    "completions",
    "embedding",
    "file",
    "finetuning",
    "image",
    "model",
    "moderation",
    "responses",
    "upload",
    "vectorstore",
] }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"
# `sync` and `macros` (`select!`) work on any target; the runtime, timers and files only natively (below).
tokio = { version = "^1.53.3", features = ["macros", "sync"] }
reqwest = { version = "^0.13.5", default-features = false }
timvw-rust-runtime = { version = "^0.4.0", default-features = false, features = ["reqwest", "retry", "fs"] }
tower = { version = "^0.5.2", default-features = false, features = ["util", "retry"] }
url = "^2.5.8"
futures = "^0.3.34"
thiserror = "^2.0.21"
tracing = "^0.1.44"
# The 0.32 semantic-conventions crate deprecates these GenAI string constants;
# 0.31 is independent of the OpenTelemetry API and SDK dependency chain.
opentelemetry-semantic-conventions = { optional = true, version = "^0.31", features = ["semconv_experimental"] }
opentelemetry = { optional = true, version = "^0.33.1", features = ["trace"] }
opentelemetry_sdk = { optional = true, version = "^0.33.1", features = ["rt-tokio", "trace", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { optional = true, version = "^0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
base64 = "^0.23.1"
bytes = "^1.12.1"
http = "^1.5.0"
http-body = "^1.0.1"
hmac = { version = "^0.12.1", optional = true }
sha2 = { version = "^0.10.9", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Streaming callbacks (`spawn`), retry backoff of upload parts (`time`), media saved to files (`fs`).
tokio = { version = "^1.53.3", features = ["rt", "time", "fs"] }
mockito = { version = "^1.7.2", optional = true }

# WebAssembly in a JavaScript host (wasm32-unknown-unknown): streaming callbacks run with `spawn_local`, timers are the
# host's `setTimeout` and clocks `performance.now()`/`Date.now()` (std's panic there). See docs/webassembly.md.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
web-time = "1"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "^1.53.3", features = ["full"] }
tokio-stream = { version = "^0.1.19", features = ["io-util"] }
mockito = "^1.7.2"
tracing-subscriber = { version = "^0.3.23", features = ["env-filter"] }
regex = "^1.13.1"
tempfile = "^3.27.0"
rand = "^0.10.3"
tower = { version = "^0.5.2", features = ["util", "retry", "timeout"] }
reqwest = { version = "^0.13.5", default-features = false, features = ["json", "stream"] }

# `tests/wasm.rs`, run in Node.js with wasm-bindgen-test-runner (see docs/webassembly.md).
[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["rustls-tls", "otel"]
# Langfuse/OpenTelemetry integration (interceptor, exporter, context).
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-semantic-conventions"]
rustls-tls = ["openai-client-base/rustls", "timvw-rust-runtime/rustls"]
native-tls = ["openai-client-base/native-tls", "timvw-rust-runtime/native-tls", "reqwest/native-tls-vendored"]
# `timvw_rust_runtime::trace::TraceLayer`: logs each HTTP request and retry with `tracing`.
tracing-http = ["timvw-rust-runtime/tracing", "openai-client-base/tracing"]
# Native only (mockito).
test-utils = ["dep:mockito"]
# `webhooks`: verify the signatures of OpenAI webhook deliveries and decode their events.
webhook = ["dep:hmac", "dep:sha2"]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
missing_const_for_fn = "allow"

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "quickstart"
doc-scrape-examples = true

[[example]]
name = "langfuse"
required-features = ["otel"]

[[example]]
name = "langfuse_simple"
required-features = ["otel"]

[[example]]
name = "langfuse_streaming"
required-features = ["otel"]
